# Docker Compose — hosted Postgres only (Neon, RDS, etc.)
#
# DATABASE_URL must reach the backend container (Prisma runs `db push` on start unless SKIP_PRISMA_PUSH=1).
# Use either:
#   • backend/.env (and/or backend/.env.production) on the server, OR
#   • a repo-root .env (same folder as this file) — optional first env_file below — common for DevOps/CI.
# If Prisma fails with P1012 "Environment variable not found: DATABASE_URL", the container did not load any
# file containing DATABASE_URL (missing file, wrong path, or empty line). Verify:
#   docker compose run --rm --no-deps backend sh -lc 'echo "${DATABASE_URL:+set}"'
#
# env_file merge order (later overrides earlier): root .env → .env.docker → .env → .env.production (all optional except you need DATABASE_URL from somewhere).
# 2) From repo root:
#      docker compose up -d --build
#    Recommended for production DB:
#      SKIP_PRISMA_PUSH=1 docker compose up -d --build
#    (Use prisma migrate deploy in CI instead of db push on container start.)
#
# Open http://localhost:${FRONTEND_PORT:-5176}
# Env files: if a value contains "$", escape as "$$" for Docker Compose (e.g. LeadSquared keys like u$…).

name: il-gmeet-tracker

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: il-gmeet-backend:latest
    environment:
      NODE_ENV: production
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env.docker
        required: false
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.production
        required: false
    command:
      - sh
      - -c
      - |
        if [ "$${SKIP_PRISMA_PUSH:-}" = "1" ]; then
          exec node src/server.js
        else
          npx prisma db push && exec node src/server.js
        fi
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: il-gmeet-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5176}:80"
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
