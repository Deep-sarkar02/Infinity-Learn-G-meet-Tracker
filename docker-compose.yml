# Docker Compose — hosted Postgres only (Neon, RDS, etc.)
#
# Copy .env.example → .env in this folder (repo root). All backend + Docker settings live in that one file.
# If Prisma fails with P1012 "Environment variable not found: DATABASE_URL", verify:
#   docker compose run --rm --no-deps backend sh -lc 'echo "${DATABASE_URL:+set}"'
#
# From repo root:
#   docker compose up -d --build
# Recommended for production DB:
#   SKIP_PRISMA_PUSH=1 docker compose up -d --build
#
# Open http://localhost:${FRONTEND_PORT:-5176}
# If a value contains "$", escape as "$$" for Docker Compose (e.g. LeadSquared keys like u$…).

name: il-gmeet-tracker

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: il-gmeet-backend:latest
    environment:
      NODE_ENV: production
      # Set on the host to skip the startup schema push, e.g. SKIP_PRISMA_PUSH=1 docker compose up -d --build
      SKIP_PRISMA_PUSH: ${SKIP_PRISMA_PUSH:-}
    env_file:
      - path: ./.env
        required: true
    command:
      - sh
      - -c
      - |
        if [ "$${SKIP_PRISMA_PUSH:-}" = "1" ]; then
          exec node src/server.js
        else
          npx prisma db push --accept-data-loss && exec node src/server.js
        fi
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: il-gmeet-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5176}:80"
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
