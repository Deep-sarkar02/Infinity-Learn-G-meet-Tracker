server {
  listen 80;
  server_name _;

  # Docker embedded DNS — resolve `backend` at request time so nginx can start
  # even if the backend container registers slightly later (avoids "host not found in upstream").
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # Backend liveness via same public origin/port.
  # proxy_pass must use a variable URL *without* a path segment, or nginx mis-rewrites the
  # request URI when the host is variable (Express then returns 404 "Route not found").
  location = /backend-health {
    set $backend_upstream http://backend:5000;
    rewrite ^ /health break;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  # Backend API reverse proxy (container-to-container).
  location /api/ {
    set $backend_upstream http://backend:5000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
